<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font-family: Arial, sans-serif; background: #111; color: #fff; text-align: center; }
  #score { margin: 10px 0; font-size: 20px; }
  canvas { background: #1b1b2f; border: 3px solid #4caf50; border-radius: 8px; }
  button { margin-top: 10px; padding: 8px 18px; font-size: 16px; border: 0; border-radius: 6px; background: #4caf50; color: #fff; cursor: pointer; }
</style>
</head>
<body>
  <div id="score">Score: 0 | Best: 0</div>
  <canvas id="c" width="400" height="400" tabindex="0"></canvas><br>
  <button onclick="reset()">Restart</button>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const size = 20, cells = canvas.width / size;
let snake, dir, nextDir, food, score, best = 0, timer, over;

function reset() {
  snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
  dir = {x: 1, y: 0};
  nextDir = dir;
  score = 0;
  over = false;
  placeFood();
  clearInterval(timer);
  timer = setInterval(tick, 120);
  updateScore();
  canvas.focus();
}

function placeFood() {
  do {
    food = {x: Math.floor(Math.random() * cells), y: Math.floor(Math.random() * cells)};
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function updateScore() {
  document.getElementById("score").textContent = "Score: " + score + " | Best: " + best;
}

function tick() {
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  if (head.x < 0 || head.y < 0 || head.x >= cells || head.y >= cells ||
      snake.some(s => s.x === head.x && s.y === head.y)) {
    over = true;
    clearInterval(timer);
    best = Math.max(best, score);
    updateScore();
    draw();
    return;
  }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++;
    best = Math.max(best, score);
    updateScore();
    placeFood();
  } else {
    snake.pop();
  }
  draw();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#ff5252";
  ctx.fillRect(food.x * size + 2, food.y * size + 2, size - 4, size - 4);
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? "#8bc34a" : "#4caf50";
    ctx.fillRect(s.x * size + 1, s.y * size + 1, size - 2, size - 2);
  });
  if (over) {
    ctx.fillStyle = "rgba(0,0,0,0.6)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#fff";
    ctx.font = "28px Arial";
    ctx.textAlign = "center";
    ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2);
  }
}

document.addEventListener("keydown", e => {
  const k = e.key;
  if (k.startsWith("Arrow")) e.preventDefault();
  if (k === "ArrowUp" && dir.y === 0) nextDir = {x: 0, y: -1};
  else if (k === "ArrowDown" && dir.y === 0) nextDir = {x: 0, y: 1};
  else if (k === "ArrowLeft" && dir.x === 0) nextDir = {x: -1, y: 0};
  else if (k === "ArrowRight" && dir.x === 0) nextDir = {x: 1, y: 0};
});

reset();
</script>
</body>
</html>
